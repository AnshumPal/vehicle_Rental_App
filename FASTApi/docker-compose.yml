version: "3.8"

services:

  # ── PostgreSQL Database ──────────────────────
  db:
    image: postgres:16
    container_name: rental_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: rental_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── FastAPI App ───────────────────────────────
  app:
    build: .
    container_name: rental_api
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@db:5432/rental_db
    depends_on:
      - db

volumes:
  postgres_data: